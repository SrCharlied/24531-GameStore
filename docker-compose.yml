services:
  db:
    image: postgres:15
    container_name: gamestore_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-proy2}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-gamestore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
    container_name: gamestore_api
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    command: /var/www/html/docker/start.sh

  # web: se agrega en Fase 2 cuando exista el frontend React

volumes:
  postgres_data:
